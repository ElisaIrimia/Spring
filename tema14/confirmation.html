<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<h2>Guest Information</h2>

<table border="1">
    <tr><th>Name</th><td th:text="${name}"></td></tr>
    <tr><th>Email</th><td th:text="${email}"></td></tr>
    <tr><th>City</th><td th:text="${city}"></td></tr>
    <tr><th>Age</th><td th:text="${age}"></td></tr>
</table>

</body>
</html>
